name: Platform checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.lock
      - run: pip install --no-deps -e backend
      - run: python -m pytest tests -q
        working-directory: backend
      - run: pip install -r backend/research/requirements.txt
      - run: python -m unittest research.tests.test_paper_consistency -q
        working-directory: backend
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - run: docker build -f backend/Dockerfile -t sports-intelligence-api .
      - run: docker build -f frontend/Dockerfile -t sports-intelligence-dashboard .
