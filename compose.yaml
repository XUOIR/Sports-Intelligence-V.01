services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      ENABLE_SCHEDULER: "false"
    ports: ["127.0.0.1:8000:10000"]
    command: ["sh", "-c", "python -m alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 10000 --workers 1"]
    restart: unless-stopped
  dashboard:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file: .env
    environment:
      BACKEND_URL: http://api:10000
    ports: ["127.0.0.1:3000:10000"]
    depends_on: [api]
    restart: unless-stopped
