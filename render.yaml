services:
  - type: web
    name: sports-intelligence-api
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    numInstances: 1
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    preDeployCommand: python -m alembic upgrade head
    autoDeployTrigger: "off"
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: THE_ODDS_API_KEY
        sync: false
      - key: ESPORTS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: ODDS_DAILY_CREDITS
        value: "15"
      - key: ODDS_REFRESHES_24H
        value: "5"
      - key: ODDS_MONTHLY_CREDITS
        value: "500"
      - key: ACTIVE_SPORTS
        value: NHL
      - key: PANDASCORE_DAILY_REQUESTS
        value: "0"
      - key: LLM_DAILY_REQUESTS
        value: "30"
      - key: LLM_DAILY_USD
        value: "0.30"
      - key: LLM_MONTHLY_USD
        value: "3"
      - key: LLM_REQUEST_USD
        value: "0.01"
      - key: NHL_DAILY_REQUESTS
        value: "300"
      - key: NHL_SCORE_DAILY_REQUESTS
        value: "1500"
      - key: ENABLE_NHL_ADVANCED_STATS
        value: "true"
      - key: NHL_ADVANCED_MONTHLY_BYTES
        value: "1500000000"
      - key: TZ
        value: America/Vancouver
  - type: web
    name: sports-intelligence-dashboard
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    numInstances: 1
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: "off"
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: sports-intelligence-api
          property: host
      - key: BACKEND_PORT
        value: "10000"
      - key: ADMIN_API_TOKEN
        fromService:
          type: web
          name: sports-intelligence-api
          envVarKey: ADMIN_API_TOKEN
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: TZ
        value: America/Vancouver
